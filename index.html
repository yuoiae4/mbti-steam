      { name: "SnowRunner", why: { ja: "車両の挙動を身体で覚える", en: "Learn a vehicle's behavior by feel", zh: "用身体感受车辆的操控" } },
      { name: "Human: Fall Flat", why: { ja: "物理演算を手探りで攻略", en: "Physics puzzles with zero hand-holding", zh: "靠摸索解决物理谜题" } },
    ]},
  ISFP: { nickname: { ja: "冒険家", en: "The Adventurer", zh: "探险家" },
    blurb: { ja: "結果よりも、その瞬間の感覚を大事にするタイプ。美しい世界に浸る時間が好き。", en: "You care more about the feeling in the moment than the outcome. You love sitting inside a beautiful world.", zh: "比起结果，你更在意当下的感受，喜欢沉浸在美丽的世界里。" },
    games: [
      { name: "Gris", why: { ja: "感情そのものを描く美しさ", en: "Beauty that expresses emotion itself", zh: "用美来表达情感本身" } },
      { name: "Abzu", why: { ja: "何も証明しなくていい海の世界", en: "An ocean with nothing to prove", zh: "无需证明什么的海洋世界" } },
      { name: "A Short Hike", why: { ja: "急がなくていい短い旅", en: "A short trip with nowhere to rush", zh: "无需匆忙的短途旅行" } },
    ]},
  ESTP: { nickname: { ja: "起業家", en: "The Entrepreneur", zh: "企业家" },
    blurb: { ja: "じっくりよりスピード重視のタイプ。今この瞬間の判断が快感になる。", en: "Speed beats a slow burn for you. Making the split-second call is where the fun is.", zh: "比起慢慢来，你更喜欢速度，瞬间的判断本身就是乐趣。" },
    games: [
      { name: "Apex Legends", why: { ja: "一瞬の判断が勝敗を分ける", en: "Split-second decisions decide everything", zh: "瞬间的判断决定胜负" } },
      { name: "Forza Horizon 5", why: { ja: "止まらないスピード感", en: "Speed with barely a pause", zh: "几乎不停歇的速度感" } },
      { name: "PUBG: BATTLEGROUNDS", why: { ja: "常に緊張感のある状況判断", en: "Constant high-stakes situational calls", zh: "持续紧张的临场判断" } },
    ]},
  ESFP: { nickname: { ja: "エンターテイナー", en: "The Entertainer", zh: "表演者" },
    blurb: { ja: "みんなで笑っている時間がいちばん楽しいタイプ。誰かと一緒に遊ぶ前提のゲームが向いている。", en: "The best moment is everyone laughing together. Games built to be played with others suit you.", zh: "大家一起笑的时刻最让你开心，为共同游玩设计的游戏最适合你。" },
    games: [
      { name: "Fall Guys", why: { ja: "気軽で誰でも笑える混戦", en: "Easy, chaotic, and fun for anyone", zh: "轻松又能让所有人开怀大笑" } },

function computeType(scores) {
  const ei = scores.E >= scores.I ? "E" : "I";
  const sn = scores.S >= scores.N ? "S" : "N";
  const tf = scores.T >= scores.F ? "T" : "F";
  const jp = scores.J >= scores.P ? "J" : "P";
  return ei + sn + tf + jp;
}

const STORAGE_KEY = "mbti-steam-history";

function App() {
  const [lang, setLang] = useState("ja");
  const [screen, setScreen] = useState("start");
  const [qIndex, setQIndex] = useState(0);
  const [scores, setScores] = useState({ E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 });
  const [resultType, setResultType] = useState(null);
  const [history, setHistory] = useState([]);
  const [saveMsg, setSaveMsg] = useState(false);
  const t = UI[lang];

  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) setHistory(JSON.parse(raw));
    } catch (e) {}
  }, []);

  const startQuiz = () => {
    setScores({ E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 });
    setQIndex(0);
    setScreen("quiz");
  };

  const answer = (value) => {
    const next = { ...scores, [value]: scores[value] + 1 };
    setScores(next);
    if (qIndex + 1 < QUESTIONS.length) {
      setQIndex(qIndex + 1);
    } else {
      setResultType(computeType(next));
      setScreen("result");
    }
  };

  const goBack = () => { if (qIndex > 0) setQIndex(qIndex - 1); };

  const saveResult = () => {
    const entry = { type: resultType, date: new Date().toISOString().slice(0, 10) };
    const next = [entry, ...history].slice(0, 20);
    setHistory(next);
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
      setSaveMsg(true);
      setTimeout(() => setSaveMsg(false), 1800);
    } catch (e) {}
  };

  const deleteEntry = (idx) => {
    const next = history.filter((_, i) => i !== idx);
    setHistory(next);
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(next)); } catch (e) {}
  };

  const loadEntry = (type) => { setResultType(type); setScreen("result"); };

  const goHome = () => setScreen("start");
  const goSaved = () => setScreen("saved");

  const current = resultType ? TYPES[resultType] : null;
  const temp = resultType ? TEMPERAMENTS[temperamentOf(resultType)] : null;
  const q = QUESTIONS[qIndex];

  const s = styles;

  return (
    <div style={s.app}>
      <div style={s.wrap}>
        <div style={s.langRow}>
          {["ja", "en", "zh"].map((code) => (
            <button key={code} onClick={() => setLang(code)}
              style={{ ...s.langBtn, borderColor: lang === code ? "#7C6CF0" : "#2A2D52", color: lang === code ? "#F2F0E9" : "#A9ACC7" }}>
              {code === "ja" ? "日本語" : code === "en" ? "English" : "中文"}
            </button>
          ))}
        </div>

        {(screen === "start" || screen === "saved") && (
          <div style={s.navRow}>
            <button onClick={goHome}
              style={{ ...s.navBtn, ...(screen === "start" ? s.navBtnActive : {}) }}>
              {t.navHome}
            </button>
            <button onClick={goSaved}
              style={{ ...s.navBtn, ...(screen === "saved" ? s.navBtnActive : {}) }}>
              {t.navSaved}{history.length > 0 ? ` (${history.length})` : ""}
            </button>
          </div>
        )}

        {screen === "start" && (
          <React.Fragment>
            <p className="display" style={s.eyebrow}>MBTI × STEAM</p>
            <h1 className="display" style={s.title}>{t.appTitle}</h1>
            <p style={s.subtitle}>{t.tagline}</p>
            <button style={s.primaryBtn} onClick={startQuiz}>{t.start}</button>

            {history.length > 0 && (
              <button style={s.savedTeaser} onClick={goSaved}>
                <span>{t.savedResults}</span>
                <span style={s.savedTeaserCount}>{t.countLabel(history.length)} →</span>
              </button>
            )}
          </React.Fragment>
        )}

        {screen === "saved" && (
          <div>
            <p className="display" style={s.eyebrow}>{t.navSaved}</p>
            {history.length === 0 ? (
              <div style={s.emptyState}>
                <p style={s.subtitle}>{t.noSaved}</p>
                <p style={{ ...s.subtitle, marginBottom: 24 }}>{t.noSavedHint}</p>
                <button style={s.primaryBtn} onClick={startQuiz}>{t.goQuiz}</button>
              </div>
            ) : (
              <div style={s.historyBox}>
                {history.map((h, i) => (
                  <div key={i} style={s.historyRow}>
                    <span className="display" style={{ fontWeight: 700 }}>{h.type}</span>
                    <span style={{ color: "#A9ACC7", fontSize: 13 }}>{t.savedOn}: {h.date}</span>
                    <button style={s.smallBtn} onClick={() => loadEntry(h.type)}>{t.loadThis}</button>
                    <button style={s.smallBtnGhost} onClick={() => deleteEntry(i)}>{t.delete}</button>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}

        {screen === "quiz" && q && (
          <div>
            <p style={s.progress}>{t.questionOf(qIndex + 1, QUESTIONS.length)}</p>
            <div style={s.progressBarOuter}>
              <div style={{ ...s.progressBarInner, width: `${(qIndex / QUESTIONS.length) * 100}%` }} />
            </div>
            <h2 className="display" style={s.question}>{q.text[lang]}</h2>
            <div style={s.optionCol}>
              <button style={s.optionBtn} onClick={() => answer(q.aVal)}>{q.a[lang]}</button>
              <button style={s.optionBtn} onClick={() => answer(q.bVal)}>{q.b[lang]}</button>
            </div>
            {qIndex > 0 && <button style={s.backBtn} onClick={goBack}>{t.back}</button>}
          </div>
        )}

        {screen === "result" && current && (
          <div>
            <p className="display" style={s.eyebrow}>{t.yourType}</p>
            <div style={s.resultHead}>
              <span className="display" style={{ ...s.resultCode, color: temp.accent }}>{resultType}</span>
              <span className="display" style={s.resultNickname}>{current.nickname[lang]}</span>
            </div>
            <p style={s.subtitle}>{current.blurb[lang]}</p>

            <div style={s.gameList}>
              {current.games.map((g) => (
                <div key={g.name} style={{ ...s.gameCard, borderLeft: `3px solid ${temp.accent}` }}>
                  <div className="display" style={s.gameName}>{g.name}</div>
                  <div style={s.gameWhy}>{g.why[lang]}</div>
                  <a href={steamUrl(g.name)} target="_blank" rel="noreferrer" style={{ ...s.steamLink, color: temp.accent }}>
                    {t.viewOnSteam} →
                  </a>
                </div>
              ))}
            </div>

            <div style={s.actionRow}>
              <button style={s.primaryBtn} onClick={saveResult}>{saveMsg ? t.saved : t.save}</button>
              <button style={s.ghostBtn} onClick={startQuiz}>{t.retake}</button>
              <button style={s.ghostBtn} onClick={goHome}>{t.navHome}</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

const styles = {
  app: { minHeight: "100vh", width: "100%", background: "#14162B", color: "#F2F0E9" },
  wrap: { maxWidth: 640, margin: "0 auto", padding: "40px 20px 72px" },
  langRow: { display: "flex", gap: 8, justifyContent: "flex-end", marginBottom: 24 },
  langBtn: { background: "#1E2140", border: "1px solid #2A2D52", borderRadius: 6, padding: "6px 10px", fontSize: 12, cursor: "pointer" },
  navRow: { display: "flex", gap: 8, marginBottom: 28, background: "#1E2140", borderRadius: 8, padding: 4 },
  navBtn: { flex: 1, background: "transparent", border: "none", borderRadius: 6, padding: "10px 14px", fontSize: 14, fontWeight: 600, color: "#A9ACC7", cursor: "pointer" },
  navBtnActive: { background: "#7C6CF0", color: "#14162B" },
  savedTeaser: { display: "flex", justifyContent: "space-between", alignItems: "center", width: "100%", marginTop: 16, background: "#1E2140", border: "1px solid #2A2D52", borderRadius: 8, padding: "14px 16px", color: "#F2F0E9", fontSize: 14, fontWeight: 600, cursor: "pointer", textAlign: "left" },
  savedTeaserCount: { color: "#A9ACC7", fontWeight: 500, fontSize: 13 },
  emptyState: { paddingTop: 8 },
  eyebrow: { fontSize: 13, color: "#A9ACC7", margin: "0 0 8px" },
  title: { fontSize: 34, fontWeight: 700, margin: "0 0 14px", lineHeight: 1.2 },
  subtitle: { color: "#A9ACC7", fontSize: 15, lineHeight: 1.6, maxWidth: 520, margin: "0 0 28px" },
  primaryBtn: { background: "#7C6CF0", color: "#14162B", border: "none", borderRadius: 6, padding: "12px 20px", fontWeight: 700, fontSize: 14, cursor: "pointer" },
  ghostBtn: { background: "transparent", color: "#A9ACC7", border: "1px solid #2A2D52", borderRadius: 6, padding: "12px 20px", fontSize: 14, cursor: "pointer" },
  progress: { color: "#A9ACC7", fontSize: 13, marginBottom: 8 },
  progressBarOuter: { height: 4, background: "#1E2140", borderRadius: 2, marginBottom: 28, overflow: "hidden" },
  progressBarInner: { height: "100%", background: "#7C6CF0", transition: "width 200ms ease" },
  question: { fontSize: 22, fontWeight: 700, lineHeight: 1.4, marginBottom: 24 },
  optionCol: { display: "flex", flexDirection: "column", gap: 10 },
  optionBtn: { background: "#1E2140", border: "1px solid #2A2D52", borderRadius: 8, padding: "16px", color: "#F2F0E9", fontSize: 15, textAlign: "left", cursor: "pointer" },
  backBtn: { marginTop: 20, background: "transparent", border: "none", color: "#A9ACC7", fontSize: 13, cursor: "pointer", textDecoration: "underline" },
  resultHead: { display: "flex", alignItems: "baseline", gap: 14, marginBottom: 8, flexWrap: "wrap" },
  resultCode: { fontSize: 48, fontWeight: 700 },
  resultNickname: { fontSize: 18, color: "#A9ACC7" },
  gameList: { display: "flex", flexDirection: "column", gap: 12, marginBottom: 32 },
  gameCard: { background: "#1E2140", borderRadius: 6, padding: 16 },
  gameName: { fontWeight: 700, fontSize: 16, marginBottom: 4 },
  gameWhy: { fontSize: 14, color: "#A9ACC7", marginBottom: 10 },
  steamLink: { fontSize: 13, fontWeight: 600, textDecoration: "none" },
  actionRow: { display: "flex", gap: 10, flexWrap: "wrap" },
  historyBox: { marginTop: 20 },
  historyTitle: { fontSize: 14, color: "#A9ACC7", marginBottom: 12 },
  historyRow: { display: "flex", alignItems: "center", gap: 10, padding: "8px 0", borderBottom: "1px solid #1E2140", flexWrap: "wrap" },
  smallBtn: { background: "#1E2140", border: "1px solid #2A2D52", borderRadius: 5, padding: "5px 10px", fontSize: 12, color: "#F2F0E9", cursor: "pointer", marginLeft: "auto" },
  smallBtnGhost: { background: "transparent", border: "1px solid #2A2D52", borderRadius: 5, padding: "5px 10px", fontSize: 12, color: "#A9ACC7", cursor: "pointer" },
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
